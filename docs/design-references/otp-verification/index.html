<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NexHaat OTP Verification Reference</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>
    <header class="topbar"><a class="brand" href="../index.html"><span
                class="brand__mark">N</span><span>NexHaat</span></a><span class="status">SECURE ACCESS</span></header>
    <main class="otp-layout">
        <section class="otp-card" data-card data-state="idle" aria-labelledby="otp-title">
            <div class="panel-mark">N</div>
            <p class="eyebrow">SECURE VERIFICATION</p>
            <h1 id="otp-title">Check your email</h1>
            <p class="subtitle">Enter the 6-digit code sent to your account email. It expires in 10 minutes.</p>
            <div class="stage">
                <div class="input-stage" data-input-stage role="group" aria-label="6-digit verification code">
                    <input class="input-pill" inputmode="numeric" maxlength="6" aria-label="Digit 1" data-digit>
                    <input class="input-pill" inputmode="numeric" maxlength="1" aria-label="Digit 2" data-digit>
                    <input class="input-pill" inputmode="numeric" maxlength="1" aria-label="Digit 3" data-digit>
                    <input class="input-pill" inputmode="numeric" maxlength="1" aria-label="Digit 4" data-digit>
                    <input class="input-pill" inputmode="numeric" maxlength="1" aria-label="Digit 5" data-digit>
                    <input class="input-pill" inputmode="numeric" maxlength="1" aria-label="Digit 6" data-digit>
                </div>
                <div class="loading" data-loading aria-hidden="true"><span></span><strong>0%</strong></div>
                <div class="result result--success" data-success aria-hidden="true"><span
                        class="check">✓</span><strong>Verified</strong></div>
                <div class="result result--error" data-error aria-hidden="true"><span class="cross">×</span><strong>Code
                        not verified</strong></div>
            </div>
            <p class="error" data-message aria-live="polite"></p>
            <button class="resend" type="button" data-resend>Didn't receive the code? <strong>Resend</strong></button>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
