# NexHaat — dependency update policy
#
# Evidence-based baseline from the supplied CI workflow:
# - npm uses `npm ci` at repository root.
# - pip runtime dependencies are in `requirements.txt`; the development
#   manifest includes it for CI/test tooling.
# - GitHub Actions are used under .github/workflows.
#
# REA MUST verify actual manifests/lockfiles and add entries for every real
# workspace or nested service. Remove any ecosystem/location that does not exist.
# Docker is intentionally not configured until a real Dockerfile is confirmed.
#
# Security updates are not delayed by the version-update cooldowns below.

version: 2

updates:
  # JavaScript / TypeScript application at repository root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 8
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-production-nonmajor:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development-nonmajor:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(npm)"

  # Python requirements manifests at repository root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 8
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pip-production-nonmajor:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      pip-development-nonmajor:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(pip)"

  # Keep GitHub Actions themselves updated, including CI and Azure deployment actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 8
    rebase-strategy: "auto"
    cooldown:
      default-days: 3
    groups:
      github-actions-nonmajor:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
