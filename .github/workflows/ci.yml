name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported interpreter; 3.14 is the deployment runtime.
        # Add a future 3.16 only after a stable release and compatible wheels exist.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      FLASK_TESTING: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify installed dependency set
        run: python -m pip check
      - name: Byte-compile application sources
        run: python -m compileall -q app migrations tests run.py wsgi.py
      - name: Check Alembic migration heads
        run: python -m flask --app run.py db heads
      - name: Run test suite
        run: python -m pytest -q
      - name: Reject whitespace errors
        run: git diff --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==0.17.0"
      - name: Ruff check
        run: python -m ruff check .

  web-build:
    name: React and Express build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Type-check and build web application
        run: npm run build