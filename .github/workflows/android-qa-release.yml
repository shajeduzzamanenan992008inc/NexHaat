name: NexHaat Android QA & APK Release Pipeline

# Fail-closed by design:
# * Every quality gate reports its real exit status; nothing is skipped silently.
# * The release job builds a genuine, release-signed APK and runs the same
#   orchestrator used locally. Missing signing secrets, a missing SDK, a failing
#   gate or a failed emulator install all fail the job instead of producing a
#   substitute artifact.
# * Published files are uploaded as build artifacts. This workflow never commits,
#   pushes, deploys, or flips production downloads.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tests-node/**'
      - 'server.ts'
      - 'serverMarketplace.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-qa-release.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Repository, Security, API & TypeScript Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (exact lockfile)
        run: npm ci

      - name: Validate repository structure
        run: python3 scripts/validate_repository_structure.py --fail-on-review

      - name: Reject leftover merge-conflict markers
        run: |
          if git grep -n -I -e '^<<<<<<< ' -e '^>>>>>>> ' -e '^=======$' -- . ; then
            echo "::error::Leftover merge-conflict markers are present; the tree cannot be released."
            exit 1
          fi
          git diff --check

      - name: Run server security tests
        run: npm test

      - name: Run marketplace API integration suite
        run: node tests-node/marketplace-api.test.mjs

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Verify APK validator regression tests
        run: python3 tests/test_apk_validator.py

  android-release:
    name: Signed Release Build, APK Validation & Emulator Verification
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Fail fast when release signing is not configured
        env:
          KEYSTORE_B64: ${{ secrets.NEXHAAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXHAAT_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXHAAT_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXHAAT_KEYSTORE_KEY_PASSWORD }}
          RELEASE_BASE_URL: ${{ vars.NEXHAAT_RELEASE_BASE_URL }}
          MEDIA_BASE_URL: ${{ vars.NEXHAAT_MEDIA_BASE_URL }}
        run: |
          set -eu
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_BASE_URL MEDIA_BASE_URL; do
            if [ -z "$(eval echo \"\$$name\")" ]; then
              echo "::error::$name is not configured; a release build cannot be produced."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release status: BLOCKED (production signing / release origin not configured)."
            exit 1
          fi

      - name: Materialize release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXHAAT_KEYSTORE_BASE64 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "NEXHAAT_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Android emulator release verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          NEXHAAT_KEYSTORE_STORE_PASSWORD: ${{ secrets.NEXHAAT_KEYSTORE_STORE_PASSWORD }}
          NEXHAAT_KEYSTORE_KEY_ALIAS: ${{ secrets.NEXHAAT_KEYSTORE_KEY_ALIAS }}
          NEXHAAT_KEYSTORE_KEY_PASSWORD: ${{ secrets.NEXHAAT_KEYSTORE_KEY_PASSWORD }}
          NEXHAAT_RELEASE_BASE_URL: ${{ vars.NEXHAAT_RELEASE_BASE_URL }}
          NEXHAAT_MEDIA_BASE_URL: ${{ vars.NEXHAAT_MEDIA_BASE_URL }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 5; done
            echo "Emulator booted."
            python3 scripts/nexhaat_qa_release_orchestrator.py
            echo "Orchestrator reported RELEASE READY."

      - name: Publish verification summary
        if: always()
        run: |
          if [ -f APK/status.json ]; then
            python3 - <<'PY'
          import json
          status = json.load(open("APK/status.json", encoding="utf-8"))
          print(f"Release status: {status.get('status')}")
          blocked = status.get("blockedBy")
          if blocked:
              print(f"Blocked by gate {blocked.get('gate')}: {blocked.get('name')}")
          for gate in status.get("gates", []):
              print(f"  gate {gate['gate']} {gate['name']}: {gate['status']}")
          PY
          else
            echo "No APK/status.json produced."
          fi

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexhaat-apk-release
          if-no-files-found: warn
          retention-days: 14
          path: |
            APK/latest.apk
            APK/latest.json
            APK/checksums.txt
            APK/status.json
            APK/releases/*.apk
            APK/releases/*.json

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexhaat-qa-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/*.html
            reports/*.json
            reports/failures/*.json
