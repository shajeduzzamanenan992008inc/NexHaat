name: Build, test, and deploy NexHaat to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the project's supported Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q app scripts run.py wsgi.py

      - name: Validate the environment template
        run: python scripts/check_env_example.py

      - name: Run the full automated test suite
        env:
          APP_ENV: testing
          FLASK_TESTING: '1'
        run: python -m pytest -q

      - name: Upload tested application artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexhaat-tested-app
          path: |
            .
            !.git/
            !.venv/
            !antenv/
            !.pytest_cache/
            !**/__pycache__/
            !tests/
            !docs/
            !*.zip
            !.env
            !**/.env
            !**/.env.*
            !instance/**
            !uploads/**
            !app/static/uploads/**
            !**/*.db
            !**/*.sqlite*
            !**/*.log
            !**/*.bak
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested application artifact
        uses: actions/download-artifact@v7
        with:
          name: nexhaat-tested-app

      - name: Log in to Azure using workload identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5C88C319200E49DFAB501AD5D50D6BEE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C55C7F7A08C14C16A801B200346FCA8B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EF0F49D77F649829D99DC9BD9B730F5 }}

      - name: Deploy tested artifact to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: NexHaat
          slot-name: Production

      - name: Set up Python for the read-only deployment smoke test
        if: ${{ vars.NEXHAAT_PUBLIC_BASE_URL != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check public health and security headers
        if: ${{ vars.NEXHAAT_PUBLIC_BASE_URL != '' }}
        env:
          SMOKE_BASE_URL: ${{ vars.NEXHAAT_PUBLIC_BASE_URL }}
        run: python scripts/smoke_test.py --base-url "$SMOKE_BASE_URL"

      - name: Warn when the post-deploy smoke URL is not configured
        if: ${{ vars.NEXHAAT_PUBLIC_BASE_URL == '' }}
        run: echo "::warning::Set GitHub repository variable NEXHAAT_PUBLIC_BASE_URL to enable automatic post-deploy HTTPS/readiness checks. Run scripts/smoke_test.py manually until then."
