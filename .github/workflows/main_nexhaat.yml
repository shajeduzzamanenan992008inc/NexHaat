# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - NexHaat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Read Python version from runtime.txt
        id: python-runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_line="$(tr -d '\r\n' < runtime.txt)"
          if [[ ! "$runtime_line" =~ ^python-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "runtime.txt must contain python-MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-runtime.outputs.version }}

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Validate and package application files
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements.txt
          test -f Procfile
          test -f run.py
          test -f wsgi.py
          test -d app
          test -d migrations
          python -m compileall -q app run.py wsgi.py

          rm -rf deploy-package
          mkdir -p deploy-package
          cp -a app migrations deploy-package/
          cp requirements.txt Procfile run.py wsgi.py runtime.txt deploy-package/
          if [ -f babel.cfg ]; then cp babel.cfg deploy-package/; fi

          test -f deploy-package/requirements.txt
          test -f deploy-package/Procfile
          test -f deploy-package/run.py
          test -d deploy-package/app
          test -d deploy-package/migrations
          find deploy-package -maxdepth 2 -type f | sort

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy-package/
          if-no-files-found: error


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy-package

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy-package/requirements.txt
          test -f deploy-package/Procfile
          test -f deploy-package/run.py
          test -d deploy-package/app
          test -d deploy-package/migrations
          find deploy-package -maxdepth 2 -type f | sort

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4CF9D0A37E2C4DBBBD8371EF6932CF7B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_98A3C7CE4B984D078599034D1736B8FB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BFADE83032784B69B44C2142B358D150 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'NexHaat'
          slot-name: 'Production'
          package: './deploy-package'
          startup-command: 'gunicorn --workers 2 --threads 4 --timeout 120 "run:app"'
          restart: true
