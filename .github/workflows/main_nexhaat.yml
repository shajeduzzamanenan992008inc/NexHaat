name: Build and deploy NexHaat to Azure Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY-PRODUCTION to authorize a manual production deployment from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexhaat-production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm_production == 'DEPLOY-PRODUCTION')
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff==0.17.0"

      - name: Verify Python dependency consistency
        run: python -m pip check

      - name: Run Python lint
        run: python -m ruff check .

      - name: Compile application sources
        run: python -m compileall -q app migrations tests run.py wsgi.py

      - name: Verify database migration heads
        run: python -m flask --app run.py db heads

      - name: Run Python tests before packaging
        env:
          FLASK_TESTING: "1"
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run frontend lint when defined
        run: npm run lint --if-present

      - name: Run frontend type checks when defined
        run: npm run typecheck --if-present

      - name: Run frontend tests when defined
        run: npm run test --if-present

      - name: Build web application
        run: npm run build

      - name: Reject environment files before packaging
        shell: bash
        run: |
          set -euo pipefail
          matches="$(find . -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            -print)"
          if [ -n "$matches" ]; then
            echo "::error::Environment files other than .env.example must not be included in a production artifact."
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Upload production package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nexhaat-production-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: |
            .
            !.git/**
            !.github/**
            !**/.git/**
            !**/.github/**
            !**/node_modules/**
            !**/antenv/**
            !**/.venv/**
            !**/venv/**
            !**/__pycache__/**
            !**/.pytest_cache/**
            !**/.ruff_cache/**
            !**/.mypy_cache/**
            !**/.env
            !**/.env.*
            !**/*.pem
            !**/*.key
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    if: needs.build.result == 'success'
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified production package
        uses: actions/download-artifact@v8.0.2
        with:
          name: nexhaat-production-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3835337063124149AAF2ED293D18D27C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4CED2CF708F4853922830CB3808C4CB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1142190C16714E219F9D335198535BE9 }}

      - name: Deploy to Azure Web App - NexHaat
        uses: azure/webapps-deploy@84a80cfe7e9889f35148ed88c307e6e93bf02578 # v3.0.7
        with:
          app-name: NexHaat
          slot-name: Production
