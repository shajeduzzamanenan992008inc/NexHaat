<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection closed warnings in iframe container
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var ws = new OrigWebSocket(url, protocols);
            if (typeof url === 'string' && (protocols === 'vite-hmr' || url.indexOf('@vite') !== -1 || protocols === undefined)) {
              ws.addEventListener('error', function(e) {
                if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
              });
              ws.addEventListener('close', function(e) {
                if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
              });
            }
            return ws;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        window.addEventListener('error', function(e) {
          if (
            (e && e.message && e.message.indexOf('WebSocket closed without opened') !== -1) ||
            (e && e.error && e.error.message && e.error.message.indexOf('WebSocket closed without opened') !== -1) ||
            (e && typeof e.filename === 'string' && e.filename.indexOf('@vite/client') !== -1)
          ) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            (e && e.reason && e.reason.message && e.reason.message.indexOf('WebSocket closed without opened') !== -1) ||
            (e && e.reason && typeof e.reason.stack === 'string' && e.reason.stack.indexOf('@vite/client') !== -1)
          ) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHaat</title>
    <meta name="description" content="NexHaat is Bangladesh's premier hyper-local multivendor marketplace for fresh foods, groceries, electronics, fashion, and local products with full customer, seller, rider, and admin workspaces." />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="NexHaat" />
    <meta property="og:description" content="NexHaat is Bangladesh's premier hyper-local multivendor marketplace for fresh foods, groceries, electronics, fashion, and local products with full customer, seller, rider, and admin workspaces." />
    <meta property="og:type" content="website" />

    <!-- Mobile & PWA Meta Tags -->
    <meta name="theme-color" content="#0a66c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NexHaat" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-page text-ink antialiased selection:bg-primary-light selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
